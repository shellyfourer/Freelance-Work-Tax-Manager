cache:
  paths:
    - backend/.gradle/wrapper
    - backend/.gradle/caches

stages:
  - build
  - test
  - push
  - sonarqube-check

backend-build:
  stage: build
  script:
    - cd backend
    - ./gradlew assemble --no-daemon

frontend-build:
  stage: build
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm run build

backend-test:
  stage: test
  script:
    - cd backend
    - ./gradlew test --no-daemon

frontend-test:
  stage: test
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm check
    - pnpm test

push-backend-image:
  stage: push
  only:
    - main
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$DOCKERHUB_USERNAME/freelance-tax-manager-backend:latest" ./backend
    - docker push "$DOCKERHUB_USERNAME/freelance-tax-manager-backend:latest"

push-frontend-image:
  stage: push
  only:
    - main
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker build --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" -t "$DOCKERHUB_USERNAME/freelance-tax-manager-frontend:latest" ./frontend
    - docker push "$DOCKERHUB_USERNAME/freelance-tax-manager-frontend:latest"

sonarqube-check:
  stage: sonarqube-check
  script:
    - echo "This is a demo stage replacing SonarQube analysis"

