cache:
  paths:
    - backend/.gradle/wrapper
    - backend/.gradle/caches

stages:
  - build
  - test
  - sonarqube-check

build:
  stage: build
  script:
    - cd backend
    - ./gradlew assemble --no-daemon

test:
  stage: test
  script:
    - cd backend
    - ./gradlew test --no-daemon

sonarqube-check:
  stage: sonarqube-check
  script:
    - echo "This is a demo stage replacing SonarQube analysis"