cache:
  paths:
    - backend/.gradle/wrapper
    - backend/.gradle/caches

stages:
  - build
  - test
  - docker-build
  - sonarqube-check

backend-build:
  stage: build
  script:
    - cd backend
    - ./gradlew assemble --no-daemon

frontend-build:
  stage: build
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm run build

backend-test:
  stage: test
  script:
    - cd backend
    - ./gradlew test --no-daemon

frontend-test:
  stage: test
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm check
    - pnpm test

docker-build-backend:
  stage: docker-build
  script:
    - docker build -t backend-image ./backend

docker-build-frontend:
  stage: docker-build
  script:
    - docker build -t frontend-image ./frontend

sonarqube-check:
  stage: sonarqube-check
  script:
    - echo "This is a demo stage replacing SonarQube analysis"

