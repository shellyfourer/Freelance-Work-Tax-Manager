cache:
  paths:
    - backend/.gradle/wrapper
    - backend/.gradle/caches

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

stages:
  - build
  - test
  - e2e-test
  - sonarqube-check
  - push
  - deploy

backend-build:
  stage: build
  script:
    - cd backend
    - ./gradlew assemble
  artifacts:
    paths:
      - backend/build/classes/
    expire_in: 1 hour

frontend-build:
  stage: build
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm run build

backend-test:
  stage: test
  script:
    - cd backend
    - ./gradlew test
  artifacts:
    paths:
      - backend/build/reports/jacoco/
    expire_in: 1 hour

frontend-test:
  stage: test
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm check
    - pnpm test --coverage
  artifacts:
    paths:
      - frontend/coverage/
    expire_in: 1 hour

playwright-e2e:
  stage: e2e-test
  script:
    - docker compose -f docker-compose.e2e.yml -p tax-manager-e2e up --build -d
    - docker ps
    - curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8081/api/clients?userId=1
    - curl --fail --retry 30 --retry-delay 2 --retry-connrefused http://localhost:3001/clients
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm test:e2e
  after_script:
    - docker compose -f docker-compose.e2e.yml -p tax-manager-e2e logs
    - docker compose -f docker-compose.e2e.yml -p tax-manager-e2e down

sonarqube-check-backend:
  stage: sonarqube-check
  needs:
    - backend-build
    - backend-test
  script:
    - cd backend
    - ./gradlew sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONAR_TOKEN_BACKEND
  allow_failure: true

sonarqube-check-frontend:
  stage: sonarqube-check
  needs:
    - frontend-test
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.token=$SONAR_TOKEN_FRONTEND
  allow_failure: true

push-backend-image:
  stage: push
  only:
    - main
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker build -t "$DOCKERHUB_USERNAME/freelance-tax-manager-backend:latest" ./backend
    - docker push "$DOCKERHUB_USERNAME/freelance-tax-manager-backend:latest"

push-frontend-image:
  stage: push
  only:
    - main
  script:
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - docker build --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" -t "$DOCKERHUB_USERNAME/freelance-tax-manager-frontend:latest" ./frontend
    - docker push "$DOCKERHUB_USERNAME/freelance-tax-manager-frontend:latest"

deploy-production:
  stage: deploy
  only:
    - main
  script:
    - cd /home/ubuntu/freelance-tax-manager
    - docker compose pull
    - docker compose up -d