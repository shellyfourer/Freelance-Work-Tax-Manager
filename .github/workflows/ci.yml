#since we are using github's VM, not our personal machine
#we need to specify the download steps each time
#we can't just call thing like ./gradlew assemble straight away
name: CI

on:
  push:
    branches:
      - main
      - github-migration
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build backend
        run: ./gradlew assemble

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew test

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test --coverage

  e2e-test:
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # GitLab supplied these as runner CI/CD variables; on GitHub they come
      # from repo secrets and are forwarded into the backend container so the
      # dev-profile OAuth config can resolve at startup.
      - name: Start e2e stack
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: docker compose -f docker-compose.e2e.yml -p tax-manager-e2e up --build -d

      - name: Wait for backend
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors -X POST http://localhost:8081/api/test/login

      - name: Wait for frontend
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:3001/clients

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          PLAYWRIGHT_BACKEND_URL: http://localhost:8081
        run: pnpm test:e2e

      - name: Tear down e2e stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml -p tax-manager-e2e down

  push-backend-image:
    runs-on: ubuntu-latest
    # GitLab ran push only after build/test/e2e stages passed; replicate that gate.
    needs:
      - backend-build
      - frontend-build
      - backend-test
      - frontend-test
      - e2e-test
    # GitLab `only: main`; on GitHub, gate to pushes on main (not PRs).
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push backend image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/freelance-tax-manager-backend:latest" ./backend
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/freelance-tax-manager-backend:latest"

  push-frontend-image:
    runs-on: ubuntu-latest
    needs:
      - backend-build
      - frontend-build
      - backend-test
      - frontend-test
      - e2e-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push frontend image
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" -t "${{ secrets.DOCKERHUB_USERNAME }}/freelance-tax-manager-frontend:latest" ./frontend
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/freelance-tax-manager-frontend:latest"

