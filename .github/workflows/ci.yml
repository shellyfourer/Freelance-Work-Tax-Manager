#since we are using github's VM, not our personal machine
#we need to specify the download steps each time
#we can't just call thing like ./gradlew assemble straight away
name: CI

on:
  push:
    branches:
      - main
      - github-migration
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build backend
        run: ./gradlew assemble

  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

backend-test:
  runs-on: ubuntu-latest

  defaults:
    run:
      working-directory: backend

  steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle
        cache-dependency-path: |
          backend/*.gradle*
          backend/gradle/wrapper/gradle-wrapper.properties

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    - name: Run backend tests
      run: ./gradlew test

frontend-test:
  runs-on: ubuntu-latest

  defaults:
    run:
      working-directory: frontend

  steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24.11.0"
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check frontend
      run: pnpm check

    - name: Run frontend tests
      run: pnpm test --coverage
